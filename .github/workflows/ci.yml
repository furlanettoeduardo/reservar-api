name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # O runner e efemero: nao ha o que limpar depois, e o container de limpeza
      # do Testcontainers custa alguns segundos por execucao.
      TESTCONTAINERS_RYUK_DISABLED: true

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes unitarios
        run: ./mvnw --batch-mode test

      # Roda contra Postgres real via Testcontainers. Nao pular no CI: e justamente
      # o teste contra o banco de verdade que pega o erro que ninguem reproduz local.
      - name: Testes de integracao
        run: ./mvnw --batch-mode verify
