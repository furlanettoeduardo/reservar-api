# Perfil de desenvolvimento: ative com --spring.profiles.active=dev
# Nao promova para application.yaml -- show-sql em producao e ruido no log e
# expoe valores de parametro (dado potencialmente sensivel) em texto claro.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
